[project]
name = "exodip"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "xgboost",
    "joblib",
    "h5py",
    "astropy",
]

[tool.vercel]
entrypoint = "backend.main:app"
